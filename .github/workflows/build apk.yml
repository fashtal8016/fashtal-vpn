
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Inspect repository
        shell: bash
        run: |
          echo "=== Repository files ==="
          ls -la

          echo "=== Gradle files ==="
          find . -type f \
            \( -name gradlew \
            -o -name settings.gradle \
            -o -name settings.gradle.kts \
            -o -name build.gradle \
            -o -name build.gradle.kts \) \
            -not -path './.git/*' \
            -not -path '*/.gradle/*' \
            -print

      - name: Locate Gradle wrapper
        id: project
        shell: bash
        run: |
          WRAPPER="$(find . -type f -name gradlew \
            -not -path './.git/*' \
            -not -path '*/.gradle/*' \
            -print -quit)"

          if [ -z "$WRAPPER" ]; then
            echo "::error::gradlew was not found."
            exit 1
          fi

          ROOT="$(dirname "$WRAPPER")"

          if [ ! -f "$ROOT/settings.gradle" ] && \
             [ ! -f "$ROOT/settings.gradle.kts" ]; then
            echo "::error::No settings.gradle or settings.gradle.kts beside gradlew."
            echo "Found wrapper: $WRAPPER"
            exit 1
          fi

          chmod +x "$WRAPPER"

          echo "root=$ROOT" >> "$GITHUB_OUTPUT"
          echo "Found project at: $ROOT"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        working-directory: ${{ steps.project.outputs.root }}
        run: ./gradlew --no-daemon assembleDebug

      - name: Collect APK
        if: success()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/apk"

          find "${{ steps.project.outputs.root }}" \
            -type f -path '*/build/outputs/apk/*/*.apk' \
            -exec cp {} "$RUNNER_TEMP/apk/" \;

          if [ -z "$(ls -A "$RUNNER_TEMP/apk")" ]; then
            echo "::error::No APK generated."
            exit 1
          fi

          ls -lh "$RUNNER_TEMP/apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Android-APK
          path: ${{ runner.temp }}/apk/*.apk
          if-no-files-found: error
          retention-days: 7
